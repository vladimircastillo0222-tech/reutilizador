# Render — despliegue gratis (plan Free, $0)
# Conecta tu repo y Render usa este archivo automáticamente.
# NOTA: el plan Free duerme la app tras inactividad y su disco es efímero
# (la base SQLite se reinicia). Para producción seria, migra a Postgres
# (ver checklist del README). Para validar y vender al inicio, el Free basta.
services:
  - type: web
    name: reutilizador
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: FREE_MONTHLY_LIMIT
        value: "5"
      - key: BASE_URL
        value: https://reutilizador.onrender.com
